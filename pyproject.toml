[project]
name = "uia-controller-app"
version = "19.0.0"
description = "UiA Controlling App for Norwegian Public Sector Financial Management, EVM Capital Project Controlling, Annual Wheel, 2026 YTD Review, Data Ingestion, Power BI & Web Portal Dashboard (v19)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "openpyxl>=3.1.0",
    "pyarrow>=12.0.0",
    "streamlit>=1.20.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
